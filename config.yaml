 # Smart Surveillance System Configuration File

# Object Detection Settings
object_detection:
  model_path: "yolov8n.pt"  # YOLOv8 nano model (fastest, good for CPU)
  detection_threshold: 0.5  # Confidence threshold (0.1 - 0.9)
  target_classes:  # Object classes to detect
    - person
    - book
    - cell phone
    - bottle
    - glasses
    - specs
    - sunglasses  # Can detect pens as bottle sometimes

# Motion Detection Settings
motion_detection:
  sensitivity: "low"  # Options: low, medium, high (set to low to reduce noise)
  min_area: 500  # Minimum pixel area to consider as motion (increased to filter small movements)

# Display Settings
display:
  enabled: true
  window_name: "Smart Surveillance"

# Snapshot Settings
snapshot:
  enabled: true
  directory: "snapshots"
  rate_limit: 1.0  # Minimum seconds between snapshots

# Logging Settings
logging:
  directory: "logs"
  max_size_mb: 10  # Maximum log file size before rotation

# Alert Settings
alerts:
  classes:  # Object classes that trigger alerts
    - person
  cooldown: 5.0  # Minimum seconds between alerts for same class

# Performance Settings
performance:
  target_fps: 10
  preprocessing_enabled: false
  resize_width: null  # Set to integer to resize frames (e.g., 640)
